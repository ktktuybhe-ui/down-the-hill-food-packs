name: Build Austria food packs
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packs as a public GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r builder/requirements.txt
      - name: Run unit tests on synthetic fixtures
        run: python -m unittest discover -s tests -v
      - name: Download authentic BLS source
        run: python builder/fetch_sources.py --out sources
      - name: Download official Open Food Facts bulk export
        run: |
          mkdir -p sources
          curl --fail --location --show-error --retry 5 --retry-delay 20 \
            --user-agent 'DownTheHill-TravelPack/0.2 (open food data re-use)' \
            --output sources/openfoodfacts.tsv.gz \
            'https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz'
          gzip -t sources/openfoodfacts.tsv.gz
      - name: Build both provenance-separated packs
        run: |
          cd builder
          python build_pack.py \
            --bls ../sources/BLS_4_0_2025_DE.zip \
            --off ../sources/openfoodfacts.tsv.gz \
            --max-off 3000 --version "1.${{ github.run_number }}" --out ../dist
      - name: Verify complete source coverage and nutrition integrity
        run: |
          python builder/verify_release.py --folder dist --bls-min 6000 --off-min 3000
          python builder/validate_pack.py dist/DownTheHill-Austria-offline-pack-v1.zip
      - name: Prepare attribution and licensing
        run: cp LICENSES_AND_SOURCES.md dist/ATTRIBUTION.md
      - name: Prepare release manifest and checksums
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          RELEASE_TAG: austria-1.${{ github.run_number }}-attempt.${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('dist/pack-index.json')
          index = json.loads(path.read_text(encoding='utf-8'))
          tag = os.environ['RELEASE_TAG']
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          index['release_tag'] = tag
          for item in index['files']:
              item['download_url'] = f"{base}/{item['file']}"
          path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cd dist
          sha256sum Austria-BLS-4.0.dthpack Austria-OpenFoodFacts.dthpack pack-index.json ATTRIBUTION.md > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Transfer verified assets to the publish job
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: austria-release-${{ github.run_attempt }}
          path: |
            dist/Austria-BLS-4.0.dthpack
            dist/Austria-OpenFoodFacts.dthpack
            dist/pack-index.json
            dist/ATTRIBUTION.md
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: austria-release-*
          path: release
      - name: Publish verified assets under a new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="release/austria-release-$GITHUB_RUN_ATTEMPT"
          if [[ ! -d "$ASSETS" ]]; then
            # A failed-job retry may reuse the successful build from an earlier attempt.
            ASSETS="$(find release -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          cd "$ASSETS"
          sha256sum --check --strict SHA256SUMS
          TAG="$(jq -er '.release_tag' pack-index.json)"
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/austria-release-draft; then
            if [[ "$(cat /tmp/austria-release-draft)" != true ]]; then
              echo "Published release $TAG already exists; existing assets are preserved."
              exit 0
            fi
            echo "Draft release $TAG already exists. Review the draft or rerun all jobs to use a new tag." >&2
            exit 1
          fi
          gh release create "$TAG" \
            Austria-BLS-4.0.dthpack Austria-OpenFoodFacts.dthpack pack-index.json ATTRIBUTION.md SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Austria Offline Food Packs $TAG" \
            --notes-file ATTRIBUTION.md
      - name: Verify public downloads and checksums
        run: |
          ASSETS="release/austria-release-$GITHUB_RUN_ATTEMPT"
          if [[ ! -d "$ASSETS" ]]; then
            ASSETS="$(find release -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          TAG="$(jq -er '.release_tag' "$ASSETS/pack-index.json")"
          VERIFY_DIR="$(mktemp -d)"
          for file in Austria-BLS-4.0.dthpack Austria-OpenFoodFacts.dthpack pack-index.json ATTRIBUTION.md SHA256SUMS; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --output "$VERIFY_DIR/$file" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
          done
          cmp "$ASSETS/SHA256SUMS" "$VERIFY_DIR/SHA256SUMS"
          cd "$VERIFY_DIR"
          sha256sum --check --strict SHA256SUMS
