name: Preserve verified USDA source candidate as durable prerelease
on:
  push:
    paths:
      - '.github/workflows/archive-international-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact previously successful USDA artifact
        run: |
          mkdir -p dist
          test "$(gh run view 43682381425 --json conclusion --jq '.conclusion')" = success
          gh run download 43682381425 --name international-core-usda-hebrew-candidate --dir dist
          test -s dist/International-Core.dthpack
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Verify SQLite integrity, source, count and Hebrew coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3,hashlib,json,struct
          p=Path('dist/International-Core.dthpack');raw=p.read_bytes()
          assert raw[:7]==b'DTHPK1\n'
          size=struct.unpack('>I',raw[7:11])[0]
          meta=json.loads(raw[11:11+size]);payload=raw[11+size:]
          assert hashlib.sha256(payload).hexdigest()==meta['sha256']
          assert meta['packID']=='core.global' and meta['source']=='USDA-FoodDataCentral'
          db=sqlite3.connect(':memory:');db.deserialize(payload)
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          count=db.execute('SELECT COUNT(*) FROM foods').fetchone()[0]
          names=db.execute("SELECT COUNT(*) FROM foods WHERE name_he GLOB '*[א-ת]*'").fetchone()[0]
          assert count>=13000 and names/count>=.95 and count==meta['count']
          print('USDA rows',count,'Hebrew labels',names,'ratio',names/count)
          db.close()
          PY
      - name: Package complete archive and provenance
        run: |
          cat > dist/ATTRIBUTION.md <<'EOF'
          USDA FoodData Central - CC0 1.0 public domain dedication, https://fdc.nal.usda.gov/
          Machine translation: generated Hebrew names, NOT reviewed for linguistic accuracy.
          Original numeric food data is from USDA; this is a QA candidate, not an approved production bundle.
          Source workflow: https://github.com/ktktuybhe-ui/down-the-hill-food-packs/actions/runs/43682381425
          EOF
          cat > dist/QA_PENDING_HE.txt <<'EOF'
          International Core USDA: 13,535 food records. Hebrew food labels were generated by machine translation.
          Nutrition data is preserved. Linguistic QA on at least 100 random and 20 challenging foods is required.
          This candidate must remain an optional download and should not be embedded in Build 31.
          EOF
          (cd dist && sha256sum International-Core.dthpack pack-index.json translation-report.json ATTRIBUTION.md QA_PENDING_HE.txt > SHA256SUMS)
          (cd dist && sha256sum --check --strict SHA256SUMS)
          (cd dist && zip -q -9 International-Core-USDA-Candidate-Backup.zip International-Core.dthpack pack-index.json translation-report.json ATTRIBUTION.md QA_PENDING_HE.txt SHA256SUMS)
      - name: Publish new non-overwriting GitHub prerelease
        run: |
          TAG='international-core-candidate-2026-11-15'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Candidate already preserved; will not replace or delete existing files.'
            exit 0
          fi
          gh release create "$TAG" dist/International-Core.dthpack dist/pack-index.json dist/translation-report.json dist/ATTRIBUTION.md dist/QA_PENDING_HE.txt dist/SHA256SUMS dist/International-Core-USDA-Candidate-Backup.zip --target "$GITHUB_SHA" --prerelease --title 'International Core USDA · Hebrew candidate (QA pending)' --notes '13,535 USDA FoodData Central items; 13,418 machine-generated Hebrew labels. Integrity and SHA256 checked. Hebrew name quality pending review. This prerelease archives real food data for recovery, it is NOT an app-ready production pack. USDA CC0.'
