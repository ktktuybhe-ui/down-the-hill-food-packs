name: Georgia full country source audit · 5 parallel shards
on:
  push:
    paths:
      - '.github/workflows/georgia-sharded-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    name: Open Food Facts pages · shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch 6 numbered source pages (100 each, independent runner)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p pages
          python -u - <<'PY'
          import json,os,time,urllib.parse,urllib.request,urllib.error,pathlib,random
          shard=int(os.environ["SHARD"])
          start=shard*6+1
          fields="code,product_name,product_name_ka,product_name_en,brands,nutriments,nutrition_data_per,serving_quantity,countries_tags,scans_n,completeness"
          for page in range(start,start+6):
              params=urllib.parse.urlencode({"countries_tags_en":"georgia","page":page,"page_size":100,"fields":fields})
              url="https://world.openfoodfacts.org/api/v2/search?"+params
              req=urllib.request.Request(url,headers={
                "User-Agent":"DownTheHill-GeorgianFoodQA/0.6.6 (github.com/ktktuybhe-ui/down-the-hill-food-packs)",
                "Accept":"application/json"})
              for attempt in range(7):
                  try:
                      with urllib.request.urlopen(req,timeout=90) as response:
                          source=json.load(response)
                      if not isinstance(source.get("products"),list):
                          raise RuntimeError("Provider returned unexpected format")
                      if int(source.get("page") or page)!=page:
                          raise RuntimeError("Wrong source page number")
                      break
                  except (urllib.error.URLError,TimeoutError,ValueError) as error:
                      print("Georgia page",page,"attempt",attempt+1,"provider",str(error),flush=True)
                      if attempt==6:raise
                      time.sleep(20+15*attempt)
              dest=pathlib.Path("pages")/f"page-{page:03d}.json"
              dest.write_text(json.dumps(source,ensure_ascii=False))
              print("Saved page",page,"returned",len(source["products"]),"country total",source.get("count"),flush=True)
              if not source["products"]:
                  print("No more products in this shard",flush=True)
                  break
              time.sleep(8)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: georgia-raw-shard-${{ matrix.shard }}
          path: pages/
          if-no-files-found: error
          retention-days: 30

  validate_and_archive:
    name: Verify full Georgia coverage, pack structure and original nutrition
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: georgia-full-candidate-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: georgia-raw-shard-*
          path: pages
          merge-multiple: true
      - name: Prove source coverage and build provenance-preserving candidate
        run: |
          python -m pip install -r builder/requirements.txt
          python -m unittest discover -s tests -v
          python -m py_compile builder/build_georgia_off.py
          python -u builder/build_georgia_off.py --pages-dir pages --version "$TAG" --out dist-georgia
          python - <<'PY'
          import json,math
          from pathlib import Path
          pages={int(p.stem.split('-')[-1]):json.loads(p.read_text()) for p in Path("pages").glob("page-*.json")}
          count=int(pages[1]["count"])
          size=min(int(pages[1].get("page_size") or 100),len(pages[1]["products"]))
          n=math.ceil(count/size)
          assert all(p in pages for p in range(1,n+1))
          products=[p for i in range(1,n+1) for p in pages[i]["products"]]
          codes=[str(p.get("code") or "") for p in products if p.get("code")]
          uniques=len(set(codes))
          assert len(products)>=count and uniques>=0.98*count,(count,len(products),uniques)
          qa=json.loads(Path("dist-georgia/qa-report.json").read_text())
          assert qa["source_records_fetched"]>=count
          print("SOURCE_COMPLETENESS_QA",json.dumps({"provider_count":count,"fetched":len(products),"unique_codes":uniques,"eligible_nutrition_rows":qa["eligible_records"],"hebrew_names":qa["hebrew_name_records"]}))
          PY
          (cd dist-georgia && sha256sum --check --strict SHA256SUMS)
          unzip -tq dist-georgia/Georgia-Candidate-Offline-Backup.zip
      - name: Verify SQLite nutrition and unit metadata
        run: |
          python - <<'PY'
          import json,hashlib,struct,sqlite3
          from pathlib import Path
          b=Path('dist-georgia/Georgia-OpenFoodFacts.dthpack').read_bytes()
          assert b[:7]==b'DTHPK1\n'
          n=struct.unpack('>I',b[7:11])[0];meta=json.loads(b[11:11+n]);body=b[11+n:]
          assert meta['packID']=='travel.ge' and meta['source']=='OpenFoodFacts' and meta['region']=='GE'
          assert hashlib.sha256(body).hexdigest()==meta['sha256']
          db=sqlite3.connect(':memory:');db.deserialize(body)
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('SELECT count(*) FROM foods').fetchone()[0]==meta['count']
          assert db.execute('SELECT count(*) FROM food_fts').fetchone()[0]==meta['count']
          assert db.execute("SELECT count(*) FROM foods WHERE base_unit not in ('g','ml')").fetchone()[0]==0
          assert db.execute("SELECT count(*) FROM foods WHERE serving_size is not null and (serving_size<=0 or serving_size>5000)").fetchone()[0]==0
          print('GEORGIA_PACK_QA_PASS',meta['count'])
          db.close()
          PY
      - name: Preserve full Georgia candidate outside expiring Actions artifacts
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag exists: refuse to overwrite source backup"
            exit 1
          fi
          gh release create "$TAG" \
            dist-georgia/Georgia-OpenFoodFacts.dthpack \
            dist-georgia/pack-index.json dist-georgia/qa-report.json \
            dist-georgia/ATTRIBUTION.md dist-georgia/QA_PENDING_HE.txt \
            dist-georgia/SHA256SUMS dist-georgia/Georgia-Candidate-Offline-Backup.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Georgia full-market OFF snapshot · candidate pending Hebrew QA" \
            --notes "Full Georgia country-page snapshot from Open Food Facts; all source pages verified, source product values retained. Pack includes only eligible products with valid macros. Hebrew name QA and Georgian traditional recipes still incomplete. NOT approved for Build 34 installation."
          gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' | grep -qx true
          mkdir -p verify
          gh release download "$TAG" --pattern 'pack-index.json' --pattern 'SHA256SUMS' --dir verify
          cmp dist-georgia/pack-index.json verify/pack-index.json
          cmp dist-georgia/SHA256SUMS verify/SHA256SUMS
          # Mark the earlier 64-row incomplete archive visibly so no one treats it as full.
          if gh release view "georgia-he-candidate-2" >/dev/null 2>&1; then
            gh release edit "georgia-he-candidate-2" \
              --title "INVALID PARTIAL Georgia source archive · 64 rows ONLY" \
              --notes "INCOMPLETE and not approved: previous provider API silently capped 500 requested items at 100 and only 64 valid food rows were built. Do not install or promote. Superseded by the sharded, coverage-verified workflow and later Georgia full-candidate Release."
          fi
