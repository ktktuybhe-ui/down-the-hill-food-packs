name: Translate and verify country food packs
on:
  pull_request:
    paths:
      - '.github/workflows/promote-translated-countries.yml'
      - 'builder/translate_country_he.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Build five country-market food packs from OFF country CSV exports']
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  translate_and_verify:
    name: ${{ matrix.title }} Hebrew translation and approved pack QA
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - country: georgia
            title: Georgia
            region: GE
          - country: spain
            title: Spain
            region: ES
          - country: italy
            title: Italy
            region: IT
          - country: france
            title: France
            region: FR
          - country: greece
            title: Greece
            region: GR
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: ${{ matrix.title }}
      REGION: ${{ matrix.region }}
      TAG: ${{ matrix.country }}-1.0
      SOURCE_TAG: country-${{ matrix.country }}-source-qa-3
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      EVENT_NAME: ${{ github.event_name }}
      PR_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm source candidate and skip unavailable sources
        id: source
        run: |
          mkdir -p original
          # A PR is only green when the country pack was ACTUALLY translated.
          # Look up a completed source workflow on the same PR branch, using
          # its immutable Actions artifact. Never return green via skipped steps.
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ -z "$PR_BRANCH" ]]; then
              echo "Missing pull request source branch" >&2
              exit 1
            fi
            SOURCE_RUN="$(gh run list --repo "$GH_REPO" \
              --workflow build-country-market-packs.yml --branch "$PR_BRANCH" \
              --event pull_request --limit 30 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success") | .databaseId][0] // empty')"
            if [[ -z "$SOURCE_RUN" ]]; then
              echo "No successful source run on PR branch $PR_BRANCH. Run source workflow first." >&2
              exit 1
            fi
          fi
          if [[ -n "$SOURCE_RUN" ]]; then
            if ! gh run view "$SOURCE_RUN" --repo "$GH_REPO" --json jobs --jq \
              ".jobs[] | select(.name == \\"$REGION source export, pack and QA\\") | .conclusion" | grep -qx success; then
              echo "Source build did not succeed for $REGION on run $SOURCE_RUN" >&2
              exit 1
            fi
            gh run download "$SOURCE_RUN" --repo "$GH_REPO" \
              --name "country-source-$REGION" --dir original
          elif [[ "$EVENT_NAME" == workflow_dispatch && ( "$REGION" == GE || "$REGION" == GR ) ]]; then
            gh release download "$SOURCE_TAG" --dir original
          else
            echo "No suitable source run for $REGION; will not silently skip translation." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          (cd original && sha256sum --check --strict SHA256SUMS)
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path('original/pack-index.json')
          d=json.loads(p.read_text())
          assert d['region']==os.environ['REGION'] and d['status']=='verified'
          assert len(d['files'])==1
          for f in d['files']:
              pack=Path('original')/f['file']
              assert hashlib.sha256(pack.read_bytes()).hexdigest()==f['sha256_file']
          print('VALID_SOURCE_CANDIDATE',os.environ['REGION'],d['files'][0]['records'])
          PY
      - name: Install local offline translation models
        if: steps.source.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          python -m pip install 'transformers>=4.44,<5' 'sentencepiece>=0.2' 'sacremoses>=0.1'
          python -m py_compile builder/translate_country_he.py
      - name: Translate only product names to Hebrew without changing original nutrition
        if: steps.source.outputs.available == 'true'
        run: |
          python -u builder/translate_country_he.py \
            --source "original/$TITLE-OpenFoodFacts.dthpack" \
            --out translated --version '1.0' --min-coverage .90
      - name: Verify no nutrient, serving, source or source-ID modifications
        if: steps.source.outputs.available == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,sqlite3,struct,os
          from pathlib import Path
          name=os.environ["TITLE"]+"-OpenFoodFacts.dthpack"
          def db_for(path):
              raw=Path(path).read_bytes()
              assert raw[:7]==b"DTHPK1\n"
              n=struct.unpack(">I",raw[7:11])[0]
              meta=json.loads(raw[11:11+n]);payload=raw[11+n:]
              assert hashlib.sha256(payload).hexdigest()==meta["sha256"]
              db=sqlite3.connect(":memory:");db.deserialize(payload)
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              return meta,db
          before,old=db_for("original/"+name)
          after,new=db_for("translated/"+name)
          protected="id,source,source_id,name_de,name_en,brand,barcode,base_unit,kcal_100,protein_100,carbs_100,fat_100,sugar_100,fiber_100,serving_size,quality_flags,source_url"
          oldrows=old.execute("SELECT "+protected+" FROM foods ORDER BY id").fetchall()
          newrows=new.execute("SELECT "+protected+" FROM foods ORDER BY id").fetchall()
          assert oldrows==newrows,"Protected nutrition/serving data changed"
          assert before["region"]==after["region"]==os.environ["REGION"]
          assert before["count"]==after["count"]==len(oldrows)
          assert new.execute("SELECT COUNT(*) FROM food_fts").fetchone()[0]==after["count"]
          for key in ("schema", "packID", "source", "license", "sourceURL"):
              assert after[key] == before[key]
          assert after["schema"] == 1 and after["packID"] == "travel." + os.environ["REGION"].lower()
          labels = new.execute("SELECT id,name_he FROM foods WHERE name_he GLOB '*[א-ת]*'").fetchall()
          for food_id, label in labels:
              term = '"' + label.replace('"', '""') + '"'
              assert new.execute("SELECT 1 FROM food_fts WHERE food_fts MATCH ? AND id=?", (term, food_id)).fetchone(), food_id
          qa=json.loads(Path("translated/hebrew-translation-report.json").read_text())
          assert qa["region"]==os.environ["REGION"]
          assert qa["coverage"]>=.90
          assert qa["human_linguistic_qa_completed"] is False
          print("HEBREW_TRANSLATION_QA_PASSED",os.environ["REGION"],qa["hebrew_name_records"],qa["records"],qa["coverage"])
          old.close();new.close()
          PY
      - name: Prepare country app index and independent full backup
        if: steps.source.outputs.available == 'true'
        run: |
          cp original/ATTRIBUTION.md translated/ATTRIBUTION.md
          cat > translated/TRANSLATION_NOTICE_HE.txt <<'EOF'
          Standard optional country food pack. Original OFF nutrition, units, names and IDs are preserved.
          Hebrew names were MACHINE TRANSLATED, not comprehensively reviewed by a person.
          This represents marketed packaged foods only, NOT all local traditional recipes.
          Some product names or translations may be inaccurate; check original labels and serving quantities.
          Open Food Facts ODbL 1.0; Helsinki-NLP models Apache-2.0; M2M100 fallback MIT.
          EOF
          python - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path("original/pack-index.json")
          x=json.loads(p.read_text())
          x["release_tag"]=os.environ["TAG"]
          x["status"]="verified"
          x["translation_review"]="machine-Hebrew-not-fully-human-reviewed"
          for f in x["files"]:
              file=pathlib.Path("translated")/f["file"]
              f["bytes"]=file.stat().st_size
              f["sha256_file"]=hashlib.sha256(file.read_bytes()).hexdigest()
              f["version"]="1.0"
          out=pathlib.Path("translated/pack-index.json")
          out.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n")
          PY
          (cd translated && sha256sum "$TITLE-OpenFoodFacts.dthpack" pack-index.json ATTRIBUTION.md hebrew-translation-report.json TRANSLATION_NOTICE_HE.txt > SHA256SUMS)
          (cd translated && sha256sum --check --strict SHA256SUMS)
          (cd translated && zip -q -9 "$TITLE-1.0-Offline-Backup.zip" "$TITLE-OpenFoodFacts.dthpack" pack-index.json ATTRIBUTION.md hebrew-translation-report.json TRANSLATION_NOTICE_HE.txt SHA256SUMS)
          unzip -tq "translated/$TITLE-1.0-Offline-Backup.zip"
      - name: Upload translation QA and candidate for Build 34 verification
        if: ${{ !cancelled() && steps.source.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: country-translation-qa-${{ matrix.region }}
          path: translated/
