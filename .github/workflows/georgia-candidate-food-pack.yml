name: Georgia food pack candidate · source QA and independent backup
on:
  push:
    paths:
      - 'builder/build_georgia_off.py'
      - '.github/workflows/georgia-candidate-food-pack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_and_archive:
    name: Gather authentic Georgian-market products and validate candidate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: georgia-he-candidate-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate builder and existing food pack tests
        run: |
          python -m pip install -r builder/requirements.txt
          python -m py_compile builder/build_georgia_off.py
          python -m unittest discover -s tests -v
      - name: Retrieve all reported products for Georgia from Open Food Facts
        run: |
          python -u builder/build_georgia_off.py --out dist-georgia --version "$TAG" --page-size 500 --max-pages 100 --pause 9
      - name: Verify data provenance, SQLite, nutrition and checksum
        run: |
          python - <<'PY'
          import json,hashlib,sqlite3,struct
          from pathlib import Path
          out=Path("dist-georgia")
          raw=(out/"Georgia-OpenFoodFacts.dthpack").read_bytes()
          assert raw[:7]==b"DTHPK1\n"
          n=struct.unpack(">I",raw[7:11])[0]
          meta=json.loads(raw[11:11+n]); data=raw[11+n:]
          assert meta["packID"]=="travel.ge" and meta["region"]=="GE" and meta["source"]=="OpenFoodFacts"
          assert meta["license"]=="ODbL 1.0"
          assert hashlib.sha256(data).hexdigest()==meta["sha256"]
          con=sqlite3.connect(":memory:");con.deserialize(data)
          assert con.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert con.execute("SELECT count(*) FROM foods").fetchone()[0]==meta["count"]
          assert con.execute("SELECT count(*) FROM food_fts").fetchone()[0]==meta["count"]
          assert con.execute("SELECT count(*) FROM foods WHERE source='OpenFoodFacts'").fetchone()[0]==meta["count"]
          assert con.execute("SELECT count(*) FROM foods WHERE kcal_100 IS NULL OR protein_100 IS NULL OR carbs_100 IS NULL OR fat_100 IS NULL").fetchone()[0]==0
          invalid_serving=con.execute("SELECT count(*) FROM foods WHERE serving_size IS NOT NULL AND (serving_size<=0 OR serving_size>5000)").fetchone()[0]
          assert invalid_serving==0
          con.close()
          report=json.loads((out/"qa-report.json").read_text())
          assert report["eligible_records"]==meta["count"]
          assert report["source_records_fetched"]>=meta["count"]
          assert report["translation_review"]=="pending manual linguistic review"
          index=json.loads((out/"pack-index.json").read_text())
          assert index["status"].startswith("candidate")
          print("GEORGIA STRUCTURAL QA PASS",meta["count"],"foods,",report["hebrew_name_records"],"Hebrew names")
          PY
          (cd dist-georgia && sha256sum --check --strict SHA256SUMS)
          unzip -tq dist-georgia/Georgia-Candidate-Offline-Backup.zip
      - name: Archive auditable candidate as GitHub prerelease (hidden from app)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Candidate tag already exists; refuse to overwrite archive."
            exit 1
          fi
          gh release create "$TAG" \
            dist-georgia/Georgia-OpenFoodFacts.dthpack \
            dist-georgia/pack-index.json dist-georgia/qa-report.json \
            dist-georgia/ATTRIBUTION.md dist-georgia/QA_PENDING_HE.txt \
            dist-georgia/SHA256SUMS dist-georgia/Georgia-Candidate-Offline-Backup.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Georgia authentic food data · QA candidate only" \
            --notes "Open Food Facts Georgian-market products with valid original nutritional labels. Strict complete pagination and SHA256/SQLite/source checks. Hebrew translations incomplete; traditional Georgian Food Composition Tables (2009) not redistributed pending license proof. NOT an approved app pack, hidden from Build 33/34."
          gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' | grep -qx true
          mkdir -p verify
          gh release download "$TAG" --pattern 'pack-index.json' --pattern 'SHA256SUMS' --dir verify
          cmp dist-georgia/pack-index.json verify/pack-index.json
          cmp dist-georgia/SHA256SUMS verify/SHA256SUMS
